<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

  <div class="view-tabs">
    <button class="view-tab active" id="tabPlanner">Planner</button>
    <button class="view-tab" id="tabGoals">Goals</button>
    <button class="view-tab" id="tabAnalysis">Analysis</button>
    <button class="view-tab" id="tabFocus">Deep Work</button>
  </div>

  <div id="plannerView">
    <div class="date-nav">
      <button id="prevDay"><i data-lucide="chevron-left" class="icon"></i></button>
      <div class="date-display">
        <div class="weekday" id="weekday"></div>
        <div class="fulldate" id="fulldate"></div>
      </div>
      <button id="nextDay"><i data-lucide="chevron-right" class="icon"></i></button>
    </div>

    <div id="lockedBanner" style="display:none;background:var(--border);color:var(--text-secondary);text-align:center;padding:0.5rem;border-radius:8px;font-size:var(--text-sm);margin-bottom:1rem;">
      <i data-lucide="lock" class="icon icon-accent"></i> This day is locked
      <button id="viewReflectionLink" style="background:none;border:none;padding:0;margin-left:0.4rem;font-family:inherit;font-size:var(--text-sm);color:var(--accent);text-decoration:underline;cursor:pointer;display:inline-flex;align-items:center;gap:0.1rem;">View reflection<i data-lucide="chevron-right" class="icon" style="width:14px;height:14px;color:inherit;"></i></button>
    </div>
    <button id="endDayBtn" class="start-focus-btn" style="background:var(--text-primary);margin-bottom:1.25rem;">End Day</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-text">
        <span id="progressCount"></span>
        <span id="progressMsg"></span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <ul id="taskList"></ul>
  </div>

  <div id="goalsView" style="display:none;">
    <ul id="goalsList"></ul>
  </div>

  <div id="analysisView" style="display:none;">
    <div class="ring-section">
      <svg id="ringChart" viewBox="0 0 200 200" width="180" height="180"></svg>
      <div class="ring-legend" id="ringLegend"></div>
    </div>
    <div id="insightsCard" style="background:var(--bg-card);border-radius:var(--radius-md);padding:1.1rem 1.3rem;margin-bottom:1.25rem;box-shadow:var(--shadow-card);"></div>
    <div id="momentumBox" style="background:var(--bg-card);border-radius:10px;padding:1rem;margin-bottom:1.25rem;text-align:center;"></div>
    <div id="focusScoreBox" style="background:var(--bg-card);border-radius:10px;padding:1rem;margin-bottom:1.25rem;text-align:center;"></div>

    <div class="range-tabs">
      <button class="range-tab active" data-range="week"><i data-lucide="bar-chart-3" class="icon"></i> Week</button>
      <button class="range-tab" data-range="month"><i data-lucide="bar-chart-3" class="icon"></i> Month</button>
      <button class="range-tab" data-range="year"><i data-lucide="bar-chart-3" class="icon"></i> Year</button>
    </div>

    <div id="barChart" class="bar-chart"></div>
    <div id="bestWorst" class="best-worst"></div>
  </div>
  <div id="reflectionView" style="display:none;">
    <div class="date-nav">
      <button id="reflPrevDay"><i data-lucide="chevron-left" class="icon"></i></button>
      <div class="date-display">
        <div class="weekday" id="reflWeekday"></div>
        <div class="fulldate" id="reflFulldate"></div>
      </div>
      <button id="reflNextDay"><i data-lucide="chevron-right" class="icon"></i></button>
    </div>

    <div id="reflWentWellGroup" class="refl-group">
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:var(--text-base);color:var(--text-secondary);margin-bottom:0.4rem;"><i data-lucide="book-open" class="icon"></i>What went well today?</label>
      <textarea id="reflWentWell" rows="3" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:var(--text-base);margin-bottom:1rem;resize:none;"></textarea>
    </div>

    <div id="reflImproveGroup" class="refl-group">
      <label style="display:flex;align-items:center;gap:0.3rem;font-size:var(--text-base);color:var(--text-secondary);margin-bottom:0.4rem;"><i data-lucide="edit-3" class="icon"></i>What could improve?</label>
      <textarea id="reflImprove" rows="3" style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:var(--text-base);margin-bottom:1rem;resize:none;"></textarea>
    </div>

    <div class="field-error" id="reflFormError"></div>
    <button id="reflSaveBtn" class="start-focus-btn" style="background:var(--accent);">Save Reflection</button>
    <button id="reflBackBtn" class="start-focus-btn" style="background:var(--border);color:var(--text-primary);display:none;">Back</button>
  </div>
  <div id="focusView">
    <div class="focus-container">
      <div id="focusSetup">
        <div class="focus-title">Deep Work</div>
        <div class="focus-subtitle">One task. No distractions.</div>
  
        <div class="focus-session-grid" id="focusSessionGrid"></div>
  
        <div class="custom-minutes-row" id="customMinutesRow" style="display:none;">
          <label>Custom minutes</label>
          <input type="number" id="customMinutesInput" min="1" placeholder="e.g. 40">
          <div class="field-error" id="customMinutesError"></div>
        </div>
  
        <div class="focus-top3">
          <div class="focus-heading">Today's Top 3</div>
          <div id="focusTopTasks"></div>
        </div>
  
        <button id="startFocusBtn" class="start-focus-btn">Start Session</button>
      </div>
  
      <div id="focusTimerScreen">
        <div class="timer-icon-controls">
          <button id="pauseResumeBtn" class="timer-icon-btn" title="Pause"><i data-lucide="pause" class="icon"></i></button>
          <button id="stopSessionBtn" class="timer-icon-btn" title="End session"><i data-lucide="x" class="icon"></i></button>
        </div>
        <div class="timer-ring-wrap">
          <svg id="timerRing" viewBox="0 0 200 200" width="240" height="240"></svg>
          <div class="timer-time" id="timerTime">25:00</div>
        </div>
        <div class="timer-label"><i data-lucide="timer" class="icon"></i> <span id="timerLabel"></span></div>
      </div>
    </div>
  </div>
  </div>

</div>

</div>

<div id="sealScreen">
  <div>
    <i data-lucide="lock" class="seal-icon"></i>
    <div class="seal-date" id="sealDate"></div>
    <div class="seal-text">Day sealed.</div>
  </div>
</div>

<div id="sessionCompleteScreen">
  <div>
    <i data-lucide="check-circle-2" class="session-complete-icon"></i>
    <div class="session-complete-info" id="sessionCompleteInfo"></div>
    <div class="session-complete-text">Session complete.</div>
  </div>
</div>

<div id="onboardingView">
  <div class="onboarding-back-wrap" id="onboardingBackWrap" style="display:none;">
    <button type="button" class="onboarding-back-btn" id="onboardingBackBtn"><i data-lucide="chevron-left" class="icon"></i></button>
  </div>
  <div class="onboarding-progress-wrap" id="onboardingProgressWrap" style="display:none;">
    <div id="onboardingStepIndicator" style="font-size:var(--text-xs);color:var(--text-muted);margin-bottom:0.35rem;"></div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="onboardingProgressFill" style="width:0%;"></div></div>
  </div>
  <div id="onboardingContent"></div>
</div>

<button class="fab" id="openAdd"><i data-lucide="plus" class="icon icon-lg"></i></button>
<button class="fab" id="openAddGoal" style="display:none;"><i data-lucide="plus" class="icon icon-lg"></i></button>
<button class="mic-fab" id="micBtn"><i data-lucide="mic" class="icon icon-lg"></i></button>
<button class="mic-fab" id="todayBtn" style="right: 9.5rem;"><i data-lucide="circle-dot" class="icon icon-lg"></i></button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Task</h3>
    <label>Task name</label>
    <input type="text" id="modalName" placeholder="e.g. Read 30 pages">
    <label class="label-icon"><i data-lucide="tag" class="icon"></i>Category</label>
    <select id="modalCategory"></select>
    <div class="modal-row">
      <div>
        <label>Time (optional)</label>
        <input type="time" id="modalTime">
      </div>
      <div>
        <label>Duration, minutes (optional)</label>
        <input type="number" id="modalDuration" placeholder="e.g. 120" min="0" step="5">
      </div>
    </div>
    <label>Date</label>
    <input type="date" id="modalDate">

    <label>Repeat</label>
    <select id="modalRepeat">
      <option value="none">Does not repeat</option>
      <option value="daily">Every day</option>
      <option value="weekly">Weekly, on selected days</option>
    </select>

    <div class="repeat-extra" id="repeatExtra">
      <label>On these days</label>
      <div class="weekday-picker" id="weekdayPicker"></div>
      <label>Every how many weeks</label>
      <input type="number" id="modalInterval" min="1" value="1">
      <label>End date (optional)</label>
      <input type="date" id="modalEndDate">

      <div class="goal-checkbox-row">
        <input type="checkbox" id="modalIsGoal">
        <label for="modalIsGoal">Track as a goal</label>
      </div>

      <div class="repeat-extra" id="modalGoalFields">
        <label>Why does this goal matter to you?</label>
        <input type="text" id="modalGoalWhy" placeholder="Be specific">

        <label>How do you plan on achieving it?</label>
        <input type="text" id="modalGoalPlan" placeholder="Be specific">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAdd">Cancel</button>
      <button class="btn-save" id="saveAdd">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModalOverlay">
  <div class="modal">
    <h3>New Category</h3>
    <label>Name</label>
    <input type="text" id="catName" placeholder="e.g. Work">
    <label>Color</label>
    <div class="color-swatches" id="colorSwatches"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="catCancel">Cancel</button>
      <button class="btn-save" id="catSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editCatModalOverlay">
  <div class="modal">
    <h3>Edit Category</h3>
    <label>Name</label>
    <input type="text" id="editCatName">
    <label>Color</label>
    <div class="color-swatches" id="editColorSwatches"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="editCatCancel">Cancel</button>
      <button class="btn-save" id="editCatSave">Save</button>
    </div>
    <div class="modal-actions" style="margin-top:0.5rem;">
      <button class="btn-delete-modal" id="editCatDelete">Delete Category</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="goalModalOverlay">
  <div class="modal">
    <h3>Add Goal</h3>
    <label>Goal name</label>
    <input type="text" id="goalName" placeholder="e.g. Play Fortnite">
    <label class="label-icon"><i data-lucide="tag" class="icon"></i>Category</label>
    <select id="goalCategory"></select>
    <label>Start date</label>
    <input type="date" id="goalStartDate">
    <label>Goal length, in days</label>
    <input type="number" id="goalLength" min="1" placeholder="e.g. 14">
    <label>Which days does this task appear on</label>
    <div class="weekday-picker" id="goalWeekdayPicker"></div>
    <label>Time (optional)</label>
    <input type="time" id="goalTime">

    <label>What will you check off each day?</label>
    <input type="text" id="goalCheckoff" placeholder="e.g. Watch one episode">

    <label>Why does this goal matter to you?</label>
    <input type="text" id="goalWhy" placeholder="Be specific">

    <label>How do you plan on achieving it?</label>
    <input type="text" id="goalPlan" placeholder="Be specific">

    <div class="modal-actions">
      <button class="btn-cancel" id="goalCancel">Cancel</button>
      <button class="btn-save" id="goalSave">Save</button>
    </div>
    <div class="field-error" id="goalFormError"></div>
  </div>
</div>
<div class="modal-overlay" id="goalViewModalOverlay">
  <div class="modal">
    <h3 id="goalViewName"></h3>
    <p style="font-size:var(--text-base); color:var(--text-secondary); margin-top:0.5rem;" id="goalViewCheckoff"></p>
    <p style="font-size:var(--text-base); color:var(--text-muted); margin-top:0.75rem;"><strong>Why:</strong> <span id="goalViewWhy"></span></p>
    <p style="font-size:var(--text-base); color:var(--text-muted); margin-top:0.5rem;"><strong>Plan:</strong> <span id="goalViewPlan"></span></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="goalViewClose">Close</button>
      <button class="btn-save" id="goalViewEdit">Edit</button>
    </div>
    <div class="modal-actions" style="margin-top:0.5rem;">
      <button class="btn-delete-modal" id="goalViewDelete">Delete Goal</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
