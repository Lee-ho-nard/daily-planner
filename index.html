<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root {
    --bg-page: #FAFAF7;
    --bg-card: #FFFFFF;
    --border: #E8E6DE;
    --text-primary: #232520;
    --text-secondary: #5C5F56;
    --text-muted: #8B8E82;
    --accent: #2F5233;
    --accent-hover: #3D6B43;
    --accent-bg: #EAF3DE;
    --danger: #B23A2E;
    --warning: #B5811F;
    --on-accent: #EAF3DE;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-elevated: 0 4px 16px rgba(0,0,0,0.08);
  }

  :root[data-theme="dark"] {
    --bg-page: #0C120D;
    --bg-card: #141C15;
    --border: #22301F;
    --text-primary: #EDEFE8;
    --text-secondary: #A9ADA0;
    --text-muted: #6E7266;
    --accent: #6FCF87;
    --accent-hover: #8FE0A3;
    --accent-bg: #1C2A1E;
    --danger: #E2726A;
    --warning: #E0AC4E;
    --on-accent: #0C120D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--bg-page); color: var(--text-primary); padding: 1.75rem 1.25rem; transition: background 0.5s ease, color 0.5s ease; -webkit-font-smoothing: antialiased; }
  .container { max-width: 480px; margin: 0 auto; }

  .view-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; background: var(--border); padding: 0.3rem; border-radius: var(--radius-md); position: relative; z-index: 6; }
  .view-tab { flex: 1; text-align: center; padding: 0.55rem; border-radius: 10px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); transition: background 0.2s, color 0.2s; }
  .view-tab.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-card); }

  .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .date-nav button { background: var(--bg-card); border: none; box-shadow: var(--shadow-card); border-radius: 50%; width: 38px; height: 38px; font-size: 1rem; cursor: pointer; color: var(--text-primary); transition: transform 0.15s; }
  .date-nav button:active { transform: scale(0.92); }
  .date-display { text-align: center; }
  .date-display .weekday { font-weight: 600; font-size: 1.15rem; letter-spacing: -0.01em; }
  .date-display .fulldate { font-size: 0.8rem; color: var(--text-secondary); margin-top: 1px; }

  .progress-wrap { margin-bottom: 1.5rem; }
  .progress-text { font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 0.5rem; display: flex; justify-content: space-between; font-weight: 500; }
  .progress-bar-track { background: var(--border); border-radius: 999px; height: 5px; overflow: hidden; }
  .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 999px; transition: width 0.5s ease; }

  .category-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
  .cat-pill { position: relative; border: none; box-shadow: var(--shadow-card); border-radius: 999px; padding: 0.45rem 0.95rem; font-size: 0.82rem; font-weight: 500; cursor: pointer; background: var(--bg-card); color: var(--text-primary); transition: background 0.15s, color 0.15s, transform 0.15s; }
  .cat-pill:active { transform: scale(0.95); }
  .cat-add { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-card); border: none; box-shadow: var(--shadow-card); cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; }

  #taskList, #goalsList { list-style: none; margin-bottom: 5rem; }
  .task-item {
    background: var(--bg-card); border-radius: var(--radius-md); padding: 1rem 1.1rem; margin-bottom: 0.55rem;
    display: flex; align-items: center; gap: 0.75rem; cursor: grab; border-left: 4px solid var(--border);
    box-shadow: var(--shadow-card);
    transition: opacity 0.4s ease, box-shadow 0.2s, transform 0.15s;
  }
  .task-item:hover { box-shadow: var(--shadow-elevated); transform: translateY(-1px); }
  .task-item.sortable-ghost { opacity: 0.3; }
  .task-item.completing { opacity: 0.5; }
  .task-item.entering { animation: taskEnter 500ms cubic-bezier(0.34, 1.56, 0.64, 1) 150ms backwards; }
  @keyframes taskEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .task-item.exiting { overflow: hidden; transition: opacity 200ms ease-out, max-height 200ms ease-out, margin-bottom 200ms ease-out, padding-top 200ms ease-out, padding-bottom 200ms ease-out; }
  .task-item.done .task-name { text-decoration: line-through; opacity: 0.5; }
  .task-name { flex: 1; font-size: 0.96rem; font-weight: 450; transition: color 250ms ease 100ms; }
  .task-item.completing .task-name { color: var(--text-muted); text-decoration: line-through; }
  .task-meta { font-size: 0.74rem; color: var(--text-secondary); white-space: nowrap; display: flex; align-items: center; gap: 0.25rem; }
  /* fixed dark text: sits on user-chosen pastel category colors, which don't shift with theme */
  .task-category { font-size: 0.68rem; font-weight: 500; padding: 0.18rem 0.55rem; border-radius: 999px; color: #1a1d26; }
  .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: color 0.15s; }
  .delete-btn:hover { color: var(--danger); }

  .checkbox { width: 21px; height: 21px; border-radius: 7px; border: 1.5px solid var(--border); cursor: pointer; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; transition: background 200ms, border-color 200ms, transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .checkbox:active { transform: scale(0.9); }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }

  .empty-msg { text-align: center; color: var(--text-secondary); padding: 3rem 1rem; font-size: 0.9rem; line-height: 1.6; }
  .empty-msg .big { font-size: 1.05rem; color: var(--text-primary); font-weight: 500; margin-bottom: 0.3rem; }

  .fab { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 1.65rem; font-weight: 300; border: none; cursor: pointer; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform 0.15s; display: flex; align-items: center; justify-content: center; }
  .fab:hover { transform: scale(1.06); }
  .fab:active { transform: scale(0.94); }

  .mic-fab { position: fixed; bottom: 1.5rem; right: 5.5rem; width: 56px; height: 56px; border-radius: 50%; background: var(--bg-card); border: none; color: var(--accent); font-size: 1.35rem; cursor: pointer; box-shadow: var(--shadow-elevated); transition: transform 0.15s; }
  .mic-fab:active { transform: scale(0.94); }
  .mic-fab.listening { background: var(--danger); color: var(--on-accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .modal-overlay {
    display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 1rem; z-index: 10;
    opacity: 0; visibility: hidden;
    transition: opacity 200ms ease, visibility 0s linear 200ms;
  }
  .modal-overlay.open {
    opacity: 1; visibility: visible;
    transition: opacity 200ms ease, visibility 0s linear 0s;
  }
  .modal { background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.75rem; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); transform: scale(0.96); opacity: 0; transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1), opacity 200ms ease; }
  .modal-overlay.open .modal { transform: scale(1); opacity: 1; }
  .modal h3 { margin-bottom: 1rem; font-weight: 600; letter-spacing: -0.01em; }
  .modal label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin: 0.8rem 0 0.3rem; font-weight: 500; }
  .modal input, .modal select { width: 100%; padding: 0.65rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary); font-size: 0.9rem; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); background: var(--bg-card); box-shadow: 0 0 0 3px var(--accent-bg); }
  .modal-row { display: flex; gap: 0.5rem; }
  .modal-row > div { flex: 1; }
  .modal-actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
  .modal-actions button { flex: 1; padding: 0.7rem; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; font-family: inherit; transition: opacity 0.15s, transform 0.1s; }
  .modal-actions button:active { transform: scale(0.97); }
  .btn-cancel { background: var(--border); color: var(--text-primary); }
  .btn-save { background: var(--accent); color: var(--on-accent); }
  .btn-delete-modal { background: color-mix(in srgb, var(--danger) 14%, var(--bg-card)); color: var(--danger); }

  .color-swatches { display: flex; gap: 0.5rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
  .swatch:active { transform: scale(0.9); }
  .swatch.selected { border-color: var(--text-primary); }

  .weekday-picker { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .weekday-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 0.75rem; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .weekday-btn.selected { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .repeat-extra { display: none; }
  .repeat-extra.show { display: block; }

  .goal-checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.9rem; }
  .goal-checkbox-row input { width: auto; }
  .goal-checkbox-row label { margin: 0; font-size: 0.85rem; color: var(--text-primary); }

  .goal-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 1.1rem; margin-bottom: 0.7rem; border-left: 4px solid var(--border); box-shadow: var(--shadow-card); }
  .goal-card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.3rem; }
  .goal-name { font-weight: 600; font-size: 1rem; letter-spacing: -0.01em; }
  .goal-pct { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
  .goal-sub { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.7rem; }
  .goal-dots { display: flex; gap: 4px; flex-wrap: wrap; }
  .goal-dot { width: 15px; height: 15px; border-radius: 5px; background: var(--bg-page); border: 1px solid var(--border); transition: transform 250ms cubic-bezier(0.34, 1.56, 0.64, 1), background 200ms, opacity 250ms; }
  .goal-dot.done { border: none; }
  .goal-dot.future { opacity: 0.4; border-style: dashed; }
  .goal-dot.milestone { box-shadow: 0 0 0 3px var(--accent-bg); }

  .ring-section { display:flex; align-items:center; gap:1.5rem; background:var(--bg-card); border-radius:var(--radius-md); padding:1.4rem; margin-bottom:1.25rem; box-shadow: var(--shadow-card); }
  .ring-legend { flex:1; font-size:0.8rem; }
  .ring-legend-row { display:flex; align-items:center; gap:0.4rem; margin-bottom:0.45rem; }
  .ring-legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .range-tabs { display:flex; gap:0.4rem; margin-bottom:1rem; background:var(--border); padding:0.3rem; border-radius:var(--radius-md); }
  .range-tab { flex:1; padding:0.5rem; border-radius:10px; border:none; background:transparent; cursor:pointer; font-family:inherit; font-size:0.82rem; font-weight:500; color:var(--text-secondary); transition: background 0.2s, color 0.2s; }
  .range-tab.active { background:var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-card); }
  .bar-chart { display:flex; align-items:flex-end; gap:4px; height:140px; background:var(--bg-card); border-radius:var(--radius-md); padding:1.1rem; margin-bottom:0.8rem; box-shadow: var(--shadow-card); }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-fill { width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; transition: height 0.4s ease; }
  .bar-label { font-size:0.6rem; color:var(--text-secondary); margin-top:0.3rem; }
  .best-worst { display:flex; gap:0.75rem; font-size:0.8rem; color: var(--text-secondary); }
  .best-worst .box { flex:1; background:var(--bg-card); border-radius:var(--radius-sm); padding:0.85rem; text-align:center; box-shadow: var(--shadow-card); }

  #focusView{
    background: var(--bg-page);
    position: fixed;
    inset: 0;
    padding: 2.5rem 1.25rem;
    color: var(--text-primary);
    overflow-y: auto;
    z-index: 5;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s, background 0.4s ease, color 0.4s ease;
  }
  #focusView.visible {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.4s ease, visibility 0s linear 0s, background 0.4s ease, color 0.4s ease;
  }
  .focus-container{ max-width:450px; margin:0 auto; position: relative; z-index: 1; padding-top: 5.5rem; }
  .focus-title{ font-size:1.9rem; font-weight:700; letter-spacing:-0.02em; margin-top:1.25rem; margin-bottom:0.5rem; }
  .focus-subtitle{ color: var(--text-secondary); line-height:1.6; margin-bottom:2rem; font-size: 0.95rem; }
  .focus-session-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; margin-bottom:2rem; }
  .focus-session{ background: var(--bg-card); border:1.5px solid transparent; border-radius:var(--radius-md); padding:1.1rem; cursor:pointer; color: var(--text-primary); transition:.2s; font-family: inherit; text-align: left; }
  .focus-session:hover{ transform:translateY(-2px); }
  .focus-session.selected{ border-color: var(--accent); background: var(--accent-bg); }
  .session-name{ font-size:0.95rem; font-weight:500; margin-bottom:0.4rem; }
  .session-time{ color: var(--text-secondary); font-size: 0.8rem; }
  .focus-heading{ font-size:0.9rem; font-weight:500; margin-bottom:0.9rem; color: var(--text-primary); }
  .focus-top3{ background: var(--bg-card); border-radius:var(--radius-md); padding:1.3rem; margin-bottom:1.75rem; }
  .focus-empty{ color: var(--text-muted); font-size: 0.9rem; }
  .start-focus-btn{ width:100%; padding:0.9rem; border:none; border-radius:var(--radius-sm); font-size:0.95rem; font-weight:600; cursor:pointer; background: var(--accent); color: var(--on-accent); font-family: inherit; transition:.2s; }
  .start-focus-btn:hover{ transform:scale(1.02); }

  .custom-minutes-row { margin-bottom: 1.5rem; }
  .custom-minutes-row label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.3rem; }
  .custom-minutes-row input { width: 100%; padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-page); color: var(--text-primary); font-family: inherit; }

  #focusTimerScreen { display: none; text-align: center; padding-top: 2rem; }
  .timer-ring-wrap { position: relative; display: inline-block; margin-bottom: 1.5rem; }
  .timer-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; }
  .timer-label { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; }
  .timer-icon-controls { position: fixed; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.75rem; }
  .timer-icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-family: inherit; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .timer-icon-btn:hover { color: var(--text-primary); border-color: var(--accent); }

  body.deep-work-mode { background: var(--bg-page); color: var(--text-secondary); }
  body.deep-work-mode .view-tabs { background: var(--bg-card); }
  body.deep-work-mode .view-tab { color: var(--text-secondary); }
  body.deep-work-mode .view-tab.active { background: var(--bg-card); color: var(--text-primary); box-shadow: none; border: 1px solid var(--accent); }
  body.timer-active .view-tabs { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
  .view-tabs { transition: opacity 0.5s ease; }

  /* Icons */
  .icon { width: 18px; height: 18px; stroke-width: 2; color: var(--text-secondary); flex-shrink: 0; vertical-align: -4px; }
  .icon-lg { width: 22px; height: 22px; }
  .date-nav button .icon, .timer-icon-btn .icon, .fab .icon, .mic-fab .icon, .delete-btn .icon, .range-tab .icon, .focus-session .icon, .cat-add .icon { color: inherit; }
  .checkbox .icon { width: 14px; height: 14px; color: var(--on-accent); }
  .drag-handle { display: flex; align-items: center; cursor: grab; color: var(--text-muted); flex-shrink: 0; }
  .drag-handle .icon { color: inherit; }
  .icon-accent { color: var(--accent); }
  .label-icon { display: flex; align-items: center; gap: 0.3rem; }

  /* Toast + field errors */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; z-index: 100;
    background: var(--bg-card); box-shadow: var(--shadow-elevated); border-radius: var(--radius-md);
    padding: 0.75rem 1.25rem; font-size: 0.85rem; color: var(--text-primary);
    display: flex; align-items: center; gap: 0.5rem; max-width: calc(100% - 2.5rem);
    opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(8px);
    transition: opacity 200ms cubic-bezier(0.34, 1.56, 0.64, 1), transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .field-error { display: none; color: var(--danger); font-size: 0.8rem; margin-top: 0.4rem; }
  .field-error.show { display: block; }

  /* View crossfade */
  #plannerView, #goalsView, #analysisView, #reflectionView { transition: opacity 150ms ease; }
</style>
</head>
<body>
<div class="container">

  <div class="view-tabs">
    <button class="view-tab active" id="tabPlanner">Planner</button>
    <button class="view-tab" id="tabGoals">Goals</button>
    <button class="view-tab" id="tabAnalysis">Analysis</button>
    <button class="view-tab" id="tabFocus">Deep Work</button>
    <button class="view-tab" id="tabReflection">Reflection</button>
  </div>

  <div id="plannerView">
    <div class="date-nav">
      <button id="prevDay"><i data-lucide="chevron-left" class="icon"></i></button>
      <div class="date-display">
        <div class="weekday" id="weekday"></div>
        <div class="fulldate" id="fulldate"></div>
      </div>
      <button id="nextDay"><i data-lucide="chevron-right" class="icon"></i></button>
    </div>

    <div id="lockedBanner" style="display:none;background:var(--border);color:var(--text-secondary);text-align:center;padding:0.5rem;border-radius:8px;font-size:0.8rem;margin-bottom:1rem;"><i data-lucide="lock" class="icon icon-accent"></i> This day is locked</div>
    <button id="endDayBtn" class="start-focus-btn" style="background:var(--text-primary);margin-bottom:1.25rem;">End Day</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-text">
        <span id="progressCount"></span>
        <span id="progressMsg"></span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <ul id="taskList"></ul>
  </div>

  <div id="goalsView" style="display:none;">
    <ul id="goalsList"></ul>
  </div>

  <div id="analysisView" style="display:none;">
    <div class="ring-section">
      <svg id="ringChart" viewBox="0 0 200 200" width="180" height="180"></svg>
      <div class="ring-legend" id="ringLegend"></div>
    </div>
    <div id="momentumBox" style="background:var(--bg-card);border-radius:10px;padding:1rem;margin-bottom:1.25rem;text-align:center;"></div>
    <div id="focusScoreBox" style="background:var(--bg-card);border-radius:10px;padding:1rem;margin-bottom:1.25rem;text-align:center;"></div>

    <div class="range-tabs">
      <button class="range-tab active" data-range="week"><i data-lucide="bar-chart-3" class="icon"></i> Week</button>
      <button class="range-tab" data-range="month"><i data-lucide="bar-chart-3" class="icon"></i> Month</button>
      <button class="range-tab" data-range="year"><i data-lucide="bar-chart-3" class="icon"></i> Year</button>
    </div>

    <div id="barChart" class="bar-chart"></div>
    <div id="bestWorst" class="best-worst"></div>
  </div>
  <div id="reflectionView" style="display:none;">
    <div class="date-nav">
      <button id="reflPrevDay"><i data-lucide="chevron-left" class="icon"></i></button>
      <div class="date-display">
        <div class="weekday" id="reflWeekday"></div>
        <div class="fulldate" id="reflFulldate"></div>
      </div>
      <button id="reflNextDay"><i data-lucide="chevron-right" class="icon"></i></button>
    </div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
  let categories = JSON.parse(localStorage.getItem("categories")) || [];
  categories = categories.filter(c => c && typeof c === "object" && c.name && c.color);
  localStorage.setItem("categories", JSON.stringify(categories));

  let currentDate = new Date();
  let activeCategory = "All";
  let editingTaskId = null;
  let lastAddedTaskId = null;
  let selectedColor = null;
  let sortableInstance = null;
  let selectedWeekdays = [];
  let currentView = "planner";

  const PALETTE = ["#B8D8BA", "#F4C7A8", "#A8C8E8", "#D4B8E8", "#F4D48A", "#9EDAD1", "#F0B8D4", "#C5C9D4"];
  const WEEKDAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];

  function setIcon(el, name, extraClass) {
    el.innerHTML = `<i data-lucide="${name}" class="icon${extraClass ? " " + extraClass : ""}"></i>`;
    lucide.createIcons();
  }

  let toastEl = null;
  let toastHideTimeout = null;
  const TOAST_ICONS = { info: "info", warning: "alert-triangle", success: "check-circle-2" };
  function showToast(message, variant, duration) {
    variant = variant || "info";
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      document.body.appendChild(toastEl);
    }
    clearTimeout(toastHideTimeout);
    const iconColor = variant === "success" ? "var(--accent)" : "var(--text-secondary)";
    toastEl.innerHTML = `<i data-lucide="${TOAST_ICONS[variant]}" class="icon" style="color:${iconColor};"></i><span>${message}</span>`;
    lucide.createIcons();
    toastEl.classList.remove("visible");
    void toastEl.offsetWidth;
    toastEl.classList.add("visible");
    toastHideTimeout = setTimeout(() => {
      toastEl.classList.remove("visible");
    }, duration || 2500);
  }

  let confirmOverlayEl = null;
  function showConfirm({ title, message, confirmLabel, danger, onConfirm }) {
    if (!confirmOverlayEl) {
      confirmOverlayEl = document.createElement("div");
      confirmOverlayEl.className = "modal-overlay";
      document.body.appendChild(confirmOverlayEl);
    }
    confirmOverlayEl.innerHTML = `
      <div class="modal">
        <h3></h3>
        <p style="font-size:0.9rem;color:var(--text-secondary);line-height:1.5;margin-top:0.25rem;"></p>
        <div class="modal-actions">
          <button class="btn-cancel" id="confirmCancelBtn">Cancel</button>
          <button class="${danger ? "btn-delete-modal" : "btn-save"}" id="confirmOkBtn"></button>
        </div>
      </div>
    `;
    confirmOverlayEl.querySelector("h3").textContent = title;
    confirmOverlayEl.querySelector("p").textContent = message;
    confirmOverlayEl.querySelector("#confirmOkBtn").textContent = confirmLabel || "Confirm";
    confirmOverlayEl.querySelector("#confirmCancelBtn").addEventListener("click", () => {
      closeModal(confirmOverlayEl);
    });
    confirmOverlayEl.querySelector("#confirmOkBtn").addEventListener("click", () => {
      closeModal(confirmOverlayEl);
      onConfirm();
    });
    openModal(confirmOverlayEl);
  }

  function openModal(el) { el.classList.add("open"); }
  function closeModal(el) { el.classList.remove("open"); }
  function closeModalInstant(el) {
    el.style.transition = "none";
    el.classList.remove("open");
    void el.offsetWidth;
    el.style.transition = "";
  }

  function animateCountUp(element, targetValue, duration, suffix) {
    suffix = suffix || "";
    duration = duration || 550;
    const startTime = performance.now();
    function frame(now) {
      const progress = Math.min((now - startTime) / duration, 1);
      element.textContent = Math.round(targetValue * progress) + suffix;
      if (progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
  function save() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("categories", JSON.stringify(categories));
  }
  function categoryColor(name) {
    const cat = categories.find(c => c.name === name);
    return cat ? cat.color : "var(--border)";
  }
  function formatDuration(mins) {
    const m = parseInt(mins);
    if (!m) return "";
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60);
    const rem = m % 60;
    return rem ? h + "h " + rem + "m" : h + "h";
  }

  function computeStreak(task) {
    const today = toDateStr(new Date());
    const start = new Date(task.date + "T00:00:00");
    const end = new Date((task.endDate || today) + "T00:00:00");
    let scheduledDays = [];
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      if (occursOn(task, d)) scheduledDays.push(toDateStr(d));
    }
    let pastScheduled = scheduledDays.filter(ds => ds <= today).slice().reverse();

    // If today is scheduled but not yet completed, don't let that break the streak —
    // just skip it and start counting from yesterday instead.
    if (pastScheduled.length && pastScheduled[0] === today && !(task.completedDates || []).includes(today)) {
      pastScheduled = pastScheduled.slice(1);
    }

    let streak = 0;
    for (const ds of pastScheduled) {
      if ((task.completedDates || []).includes(ds)) streak++;
      else break;
    }
    return streak;
  }
  function occursOn(t, dateObj) {
    const dateStr = toDateStr(dateObj);
    if (!t.recurrence || t.recurrence.type === "none") {
      return t.date === dateStr;
    }
    if (dateStr < t.date) return false;
    if (t.endDate && dateStr > t.endDate) return false;
    if (t.recurrence.type === "daily") return true;
    if (t.recurrence.type === "weekly") {
      const dayIndex = dateObj.getDay();
      if (!t.recurrence.days.includes(dayIndex)) return false;
      const startDate = new Date(t.date + "T00:00:00");
      const msPerDay = 86400000;
      const daysDiff = Math.floor((dateObj - startDate) / msPerDay);
      const weeksDiff = Math.floor(daysDiff / 7);
      const interval = t.recurrence.interval || 1;
      return weeksDiff % interval === 0;
    }
    return false;
  }

  function getTasksForDate(dateObj, categoryFilter) {
    const dateStr = toDateStr(dateObj);
    let list = tasks.filter(t => occursOn(t, dateObj));
    if (categoryFilter && categoryFilter !== "All") {
      list = list.filter(t => t.category === categoryFilter);
    }
    return list.map(t => {
      const isRecurring = t.recurrence && t.recurrence.type !== "none";
      const done = isRecurring ? (t.completedDates || []).includes(dateStr) : t.done;
      return { ...t, occurrenceDate: dateStr, occurrenceDone: done, isRecurring };
    }).sort((a, b) => {
      if (a.occurrenceDone !== b.occurrenceDone) return a.occurrenceDone ? 1 : -1;
      return (a.order ?? 0) - (b.order ?? 0);
    });
  }

  // --- View switching ---
  const CROSSFADE_VIEW_IDS = { planner: "plannerView", goals: "goalsView", analysis: "analysisView", reflection: "reflectionView" };

  function switchView(view) {
    if (pendingLockDate && view !== "reflection") {
      showToast("Finish your reflection to end the day.", "warning");
      return;
    }
    const previousView = currentView;
    currentView = view;

    document.getElementById("tabPlanner").classList.toggle("active", view === "planner");
    document.getElementById("tabGoals").classList.toggle("active", view === "goals");
    document.getElementById("tabAnalysis").classList.toggle("active", view === "analysis");
    document.getElementById("tabFocus").classList.toggle("active", view === "focus");
    document.getElementById("tabReflection").classList.toggle("active", view === "reflection");

    document.getElementById("focusView").classList.toggle("visible", view === "focus");

    document.getElementById("openAdd").style.display = view === "planner" ? "block" : "none";
    document.getElementById("openAddGoal").style.display = view === "goals" ? "block" : "none";
    document.getElementById("micBtn").style.display = view === "planner" ? "block" : "none";
    document.getElementById("todayBtn").style.display = view === "planner" ? "block" : "none";
    document.body.classList.toggle("deep-work-mode", view === "focus");
    document.documentElement.setAttribute("data-theme", view === "focus" ? "dark" : "light");

    function renderNewView() {
      if (view === "goals") renderGoals();
      if (view === "analysis") renderAnalysis();
      if (view === "reflection") renderReflection();
      if (view === "focus") renderFocus();
    }

    const prevEl = CROSSFADE_VIEW_IDS[previousView] ? document.getElementById(CROSSFADE_VIEW_IDS[previousView]) : null;
    const nextEl = CROSSFADE_VIEW_IDS[view] ? document.getElementById(CROSSFADE_VIEW_IDS[view]) : null;

    function showNextView() {
      if (nextEl) {
        nextEl.style.display = "block";
        nextEl.style.opacity = "0";
        requestAnimationFrame(() => { nextEl.style.opacity = "1"; });
      }
      renderNewView();
    }

    if (prevEl && nextEl && prevEl !== nextEl) {
      prevEl.style.opacity = "0";
      setTimeout(() => {
        prevEl.style.display = "none";
        showNextView();
      }, 120);
    } else {
      if (prevEl && prevEl !== nextEl) {
        prevEl.style.opacity = "";
        prevEl.style.display = "none";
      }
      showNextView();
    }
  }

  document.getElementById("tabPlanner").addEventListener("click", () => switchView("planner"));
  document.getElementById("tabGoals").addEventListener("click", () => switchView("goals"));
  document.getElementById("tabAnalysis").addEventListener("click", () => switchView("analysis"));
  document.getElementById("tabFocus").addEventListener("click", () => switchView("focus"));
  document.getElementById("tabReflection").addEventListener("click", () => switchView("reflection"));

  // --- Goals ---
  function renderGoals() {
    const listEl = document.getElementById("goalsList");
    listEl.innerHTML = "";
    const goalTasks = tasks.filter(t => t.isGoal);

    if (goalTasks.length === 0) {
      const msg = document.createElement("div");
      msg.className = "empty-msg";
      msg.innerHTML = `<i data-lucide="target" class="icon" style="width:28px;height:28px;color:var(--text-muted);display:block;margin:0 auto 0.5rem;"></i><div class="big">No goals yet.</div>Tap + to create one.`;
      listEl.appendChild(msg);
      lucide.createIcons();
      return;
    }

    const today = toDateStr(new Date());

    goalTasks.forEach(goal => {
      const startDate = new Date(goal.date + "T00:00:00");
      const endDate = new Date((goal.endDate || goal.date) + "T00:00:00");

      let scheduledDays = [];
      for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
        if (occursOn(goal, d)) scheduledDays.push(toDateStr(d));
      }

      const doneCount = scheduledDays.filter(ds => (goal.completedDates || []).includes(ds)).length;
      const pct = scheduledDays.length ? Math.round((doneCount / scheduledDays.length) * 100) : 0;
      const streak = computeStreak(goal);

      const card = document.createElement("li");
      card.className = "goal-card";
      card.style.borderLeftColor = categoryColor(goal.category);

      const top = document.createElement("div");
      top.className = "goal-card-top";
      const name = document.createElement("div");
      name.className = "goal-name";
      name.innerHTML = '<i data-lucide="target" class="icon"></i> ';
      name.append(goal.name);
      const pctEl = document.createElement("div");
      pctEl.className = "goal-pct";
      pctEl.textContent = pct + "%";

      const menuBtn = document.createElement("button");
      menuBtn.innerHTML = '<i data-lucide="more-vertical" class="icon"></i>';
      menuBtn.style.cssText = "background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0 0.3rem;display:flex;align-items:center;";
      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openGoalViewModal(goal.id);
      });

      top.appendChild(name);
      top.appendChild(pctEl);
      top.appendChild(menuBtn);

      const sub = document.createElement("div");
      sub.className = "goal-sub";
      sub.append(`${goal.category} · ${doneCount} / ${scheduledDays.length} days`);
      if (streak > 0) {
        sub.append(" · ");
        const flame = document.createElement("i");
        flame.setAttribute("data-lucide", "flame");
        flame.className = "icon";
        sub.appendChild(flame);
        sub.append(` ${streak} day${streak === 1 ? "" : "s"}`);
      }

      const dots = document.createElement("div");
      dots.className = "goal-dots";
      let consecutiveDone = 0;
      scheduledDays.forEach((ds, idx) => {
        const dot = document.createElement("div");
        const isDone = (goal.completedDates || []).includes(ds);
        const isFuture = ds > today;
        dot.className = "goal-dot" + (isDone ? " done" : "") + (isFuture && !isDone ? " future" : "");
        if (isDone) {
          dot.style.background = categoryColor(goal.category);
          consecutiveDone++;
          if (consecutiveDone % 7 === 0) dot.classList.add("milestone");
        } else {
          consecutiveDone = 0;
        }
        dot.title = ds;
        dot.style.opacity = "0";
        dot.style.transform = "scale(0.7)";
        dots.appendChild(dot);

        const targetOpacity = (isFuture && !isDone) ? "0.4" : "1";
        const delay = Math.min(idx * 12, 300);
        requestAnimationFrame(() => {
          setTimeout(() => {
            dot.style.opacity = targetOpacity;
            dot.style.transform = "scale(1)";
          }, delay);
        });
      });

      card.appendChild(top);
      card.appendChild(sub);
      card.appendChild(dots);
      listEl.appendChild(card);
    });
    lucide.createIcons();
  }

   

  function renderDate() {
    const today = new Date(); today.setHours(0,0,0,0);
    const check = new Date(currentDate); check.setHours(0,0,0,0);
    const diffDays = Math.round((check - today) / 86400000);

    let prefix = "";
    if (diffDays === 0) prefix = "Today, ";
    else if (diffDays === 1) prefix = "Tomorrow, ";
    else if (diffDays === -1) prefix = "Yesterday, ";

    document.getElementById("weekday").textContent = prefix + currentDate.toLocaleDateString(undefined, { weekday: "long" });
    document.getElementById("fulldate").textContent = currentDate.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
  }

  function renderProgress(dayTasks) {
    const total = dayTasks.length;
    const done = dayTasks.filter(t => t.occurrenceDone).length;
    const wrap = document.getElementById("progressWrap");
    if (total === 0) { wrap.style.display = "none"; return; }
    wrap.style.display = "block";
    const pct = Math.round((done / total) * 100);
    document.getElementById("progressCount").textContent = `${done} / ${total} tasks completed`;
    document.getElementById("progressFill").style.width = pct + "%";
    const remaining = total - done;
    let msg = "";
    if (remaining === 0) msg = "Everything completed";
    else if (remaining === 1) msg = "Only 1 task left";
    else if (pct >= 75) msg = `Almost there — ${remaining} to go`;
    else if (pct >= 50) msg = `Over halfway — ${remaining} to go`;
    else if (done > 0) msg = `${remaining} more to go`;
    document.getElementById("progressMsg").textContent = msg;
  }

  function renderCategoryTabs() {
    const wrap = document.getElementById("categoryTabs");
    wrap.innerHTML = "";

    const allCount = getTasksForDate(currentDate, "All").length;
    const allPill = document.createElement("button");
    allPill.className = "cat-pill";
    allPill.style.background = activeCategory === "All" ? "var(--accent)" : "var(--bg-card)";
    allPill.style.color = activeCategory === "All" ? "var(--on-accent)" : "var(--text-primary)";
    allPill.textContent = allCount > 0 ? `All (${allCount})` : "All";
    allPill.addEventListener("click", () => { activeCategory = "All"; renderAll(); });
    wrap.appendChild(allPill);

    categories.forEach(cat => {
      const count = getTasksForDate(currentDate, cat.name).length;
      const pill = document.createElement("button");

  function renderTasks() {
    const listEl = document.getElementById("taskList");

      const drag = document.createElement("div");

      const checkbox = document.createElement("div");

      checkbox.innerHTML = task.occurrenceDone ? '<i data-lucide="check" class="icon"></i>' : "";
      checkbox.addEventListener("click", (e) => {
        e.stopPropagation();
        if (isDayLocked(task.occurrenceDate)) { showToast("This day is locked. Reflection already completed.", "warning"); return; }
        const realTask = tasks.find(t => t.id === task.id);
        let nowDone;
        if (task.isRecurring) {
          realTask.completedDates = realTask.completedDates || [];
          const idx = realTask.completedDates.indexOf(task.occurrenceDate);
          if (idx === -1) { realTask.completedDates.push(task.occurrenceDate); nowDone = true; }
          else { realTask.completedDates.splice(idx, 1); nowDone = false; }
        } else {
          realTask.done = !realTask.done;
          nowDone = realTask.done;
        }

        checkbox.classList.toggle("checked", nowDone);
        checkbox.style.transform = "scale(1.08)";
        setTimeout(() => { checkbox.style.transform = "scale(1)"; }, 200);

        if (nowDone) {
          checkbox.innerHTML = '<i data-lucide="check" class="icon" style="opacity:0;transform:scale(0.5);transition:opacity 200ms cubic-bezier(0.34,1.56,0.64,1), transform 200ms cubic-bezier(0.34,1.56,0.64,1);"></i>';

            checkIcon.style.opacity = "1";
            checkIcon.style.transform = "scale(1)";
          });
          li.classList.add("completing");
          save();
          setTimeout(() => renderTasks(), 450);

          checkbox.innerHTML = "";
          save();
          setTimeout(() => renderTasks(), 200);

      const goalIcon = task.isGoal ? '<i data-lucide="target" class="icon"></i>' : "";
      let streakIcon = "";
      if (task.isRecurring) {
        const realTask = tasks.find(t => t.id === task.id);
        const streak = computeStreak(realTask);
        streakIcon = streak > 0 ? `<i data-lucide="flame" class="icon"></i>${streak}` : '<i data-lucide="repeat" class="icon"></i>';
      }
      const metaParts = [task.time, durIcon, streakIcon, goalIcon].filter(Boolean);
      meta.innerHTML = metaParts.join(" · ");

      const cat = document.createElement("span");
      cat.className = "task-category";
      cat.style.background = categoryColor(task.category);
      cat.textContent = task.category;

      const del = document.createElement("button");
      del.className = "delete-btn";
      del.innerHTML = '<i data-lucide="x" class="icon"></i>';
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        const label = task.isRecurring ? "Delete this whole repeating task series?" : "Delete this task?";
        showConfirm({
          title: "Delete task",
          message: label,
          confirmLabel: "Delete",
          danger: true,
          onConfirm: () => {
            const height = li.offsetHeight;
            li.style.maxHeight = height + "px";
            li.classList.add("exiting");
            void li.offsetHeight;
            requestAnimationFrame(() => {
              li.style.opacity = "0";
              li.style.maxHeight = "0px";
              li.style.marginBottom = "0px";
              li.style.paddingTop = "0px";
              li.style.paddingBottom = "0px";
            });
            setTimeout(() => {
              tasks = tasks.filter(t => t.id !== task.id);
              save();
              renderTasks();
            }, 200);
          }
        });
      });

      li.addEventListener("click", (e) => {
        if (e.target === checkbox || e.target === del) return;
        openEditModal(task.id);
      });

      li.appendChild(drag);
      li.appendChild(checkbox);
      li.appendChild(name);
      if (metaParts.length) li.appendChild(meta);
      li.appendChild(cat);
      li.appendChild(del);
      listEl.appendChild(li);
    });
    lucide.createIcons();
    lastAddedTaskId = null;

    if (sortableInstance) sortableInstance.destroy();
    sortableInstance = new Sortable(listEl, {
      animation: 150,

      onEnd: () => {
        const newOrderIds = [...listEl.children].map(li => li.dataset.taskId).filter(Boolean);

        });
        save();
      }
    });

  function parseAndFillModal(text) {
    let working = " " + text.toLowerCase() + " ";
    let parsedDate = toDateStr(currentDate);
    let parsedTime = "";
    let parsedCategory = "";
    let parsedDuration = "";

    if (working.includes("tomorrow")) {
      const d = new Date(currentDate); d.setDate(d.getDate() + 1);
      parsedDate = toDateStr(d);
      working = working.replace("tomorrow", " ");
    } else if (working.includes("today")) {
      working = working.replace("today", " ");
    } else {
      const inXDays = working.match(/in (\d+) days?/);
      if (inXDays) {
        const d = new Date(currentDate); d.setDate(d.getDate() + parseInt(inXDays[1]));
        parsedDate = toDateStr(d);
        working = working.replace(inXDays[0], " ");
      }
    }

    const timeMatch = working.match(/(\d{1,2}):(\d{2})|(\d{1,2})\s?(am|pm)/);
    if (timeMatch) {
      if (timeMatch[1]) {
        parsedTime = timeMatch[1].padStart(2, "0") + ":" + timeMatch[2];
      } else {
        let h = parseInt(timeMatch[3]);
        if (timeMatch[4] === "pm" && h !== 12) h += 12;
        if (timeMatch[4] === "am" && h === 12) h = 0;
        parsedTime = String(h).padStart(2, "0") + ":00";
      }
      working = working.replace(timeMatch[0], " ");
    }

    const durMatch = working.match(/(\d+(\.\d+)?)\s?(hours?|hrs?|minutes?|mins?)/);
    if (durMatch) {
      const num = parseFloat(durMatch[1]);
      const unit = durMatch[3];
      parsedDuration = unit.startsWith("h") ? Math.round(num * 60) : Math.round(num);
      working = working.replace(durMatch[0], " ");
    }

    const WEEKDAY_NAMES = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
    let parsedRepeatType = "none";
    let parsedWeekdays = [];
    let parsedInterval = 1;

    if (/every day|daily/.test(working)) {
      parsedRepeatType = "daily";
      working = working.replace(/every day|daily/, " ");
    } else if (working.includes("every")) {
      const intervalMatch = working.match(/every\s+(\d+)\s+weeks?/);
      if (intervalMatch) {
        parsedInterval = parseInt(intervalMatch[1]);
        working = working.replace(intervalMatch[0], " every ");
      }
      Object.keys(WEEKDAY_NAMES).forEach(dayName => {
        if (working.includes(dayName)) {
          parsedWeekdays.push(WEEKDAY_NAMES[dayName]);
          working = working.replace(new RegExp(dayName, "g"), " ");
        }
      });
      if (parsedWeekdays.length > 0) {
        parsedRepeatType = "weekly";
        working = working.replace(/\bevery\b/g, " ");
      }
    }

    const catMatch = working.match(/categor(y|ie)\s+(\w+)/);
    if (catMatch) {
      const spoken = catMatch[2];
      const found = categories.find(c => c.name.toLowerCase() === spoken);
      if (found) parsedCategory = found.name;
      working = working.replace(catMatch[0], " ");
    }

    const taskName = working
      .replace(/,/g, " ")
      .replace(/\./g, " ")
      .replace(/\bduration\b/gi, " ")
      .replace(/\bam\b|\bpm\b/gi, " ")
      .replace(/\s+/g, " ")
      .trim();

    editingTaskId = null;
    document.getElementById("modalTitle").textContent = "Add Task (from voice)";
    document.getElementById("modalName").value = taskName.charAt(0).toUpperCase() + taskName.slice(1);
    document.getElementById("modalTime").value = parsedTime;
    document.getElementById("modalDate").value = parsedDate;
    document.getElementById("modalDuration").value = parsedDuration;
    document.getElementById("modalEndDate").value = "";
    document.getElementById("modalIsGoal").checked = false;
    repeatSelect.value = parsedRepeatType;
    if (parsedRepeatType !== "none") {
      repeatExtra.classList.add("show");
      selectedWeekdays = parsedWeekdays;
      document.getElementById("modalInterval").value = parsedInterval;
    } else {
      repeatExtra.classList.remove("show");
      selectedWeekdays = [];
    }
    buildWeekdayPicker();
    if (parsedCategory) document.getElementById("modalCategory").value = parsedCategory;
    openModal(overlay);
  }

      g.checkoffLabel = checkoffLabel; g.why = why; g.plan = plan;
      g.date = startDate; g.endDate = endDate; g.recurrence = recurrence;
      editingGoalId = null;
    } else {
      tasks.push({
        id: Date.now().toString(), name, category, time, duration: "",
        date: startDate, endDate, done: false, order: 0,
        recurrence, completedDates: [], isGoal: true,
        checkoffLabel, why, plan
      });
    }

    save();
    closeModal(goalOverlay);
    renderGoals();
  });

  goalOverlay.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("goalSave").click();
    if (e.key === "Escape") closeModal(goalOverlay);
  });
  goalOverlay.addEventListener("input", () => {
    document.getElementById("goalFormError").classList.remove("show");
  });
  const goalViewOverlay = document.getElementById("goalViewModalOverlay");

function openGoalViewModal(goalId) {
  const g = tasks.find(t => t.id === goalId);
  if (!g) return;
  document.getElementById("goalViewName").textContent = g.name;
  document.getElementById("goalViewCheckoff").textContent = "Daily check-off: " + (g.checkoffLabel || g.name);
  document.getElementById("goalViewWhy").textContent = g.why || "—";
  document.getElementById("goalViewPlan").textContent = g.plan || "—";
  editingGoalId = goalId;
  openModal(goalViewOverlay);
}

document.getElementById("goalViewClose").addEventListener("click", () => {
  closeModal(goalViewOverlay);
});

document.getElementById("goalViewDelete").addEventListener("click", () => {
  closeModalInstant(goalViewOverlay);
  showConfirm({
    title: "Delete goal",
    message: "Delete this goal entirely?",
    confirmLabel: "Delete",
    danger: true,
    onConfirm: () => {
      tasks = tasks.filter(t => t.id !== editingGoalId);
      save();
      renderGoals();
    }
  });
});

document.getElementById("goalViewEdit").addEventListener("click", () => {
  const g = tasks.find(t => t.id === editingGoalId);
  closeModal(goalViewOverlay);

  document.getElementById("goalName").value = g.name;
  document.getElementById("goalStartDate").value = g.date;
  const length = Math.round((new Date(g.endDate) - new Date(g.date)) / 86400000) + 1;
  document.getElementById("goalLength").value = length;
  document.getElementById("goalTime").value = g.time || "";
  document.getElementById("goalCheckoff").value = g.checkoffLabel || "";
  document.getElementById("goalWhy").value = g.why || "";
  document.getElementById("goalPlan").value = g.plan || "";

  goalSelectedWeekdays = g.recurrence.type === "daily" ? [0,1,2,3,4,5,6] : [...g.recurrence.days];
  buildGoalWeekdayPicker();

  const sel = document.getElementById("goalCategory");
  sel.innerHTML = "";
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat.name;
    opt.textContent = cat.name;
    sel.appendChild(opt);
  });
  sel.value = g.category;

  document.getElementById("goalFormError").classList.remove("show");
  openModal(goalOverlay);
});
let currentRange = "week";

function renderAnalysis() {
    renderRingChart();
    renderBarChart(currentRange);
    renderMomentum();
    renderFocusScore();
  }

  function renderFocusScore() {
    const todayTasks = getTasksForDate(new Date(), "All");
    const completionPct = todayTasks.length
      ? (todayTasks.filter(t => t.occurrenceDone).length / todayTasks.length) * 100
      : 0;

    const goalTasks = tasks.filter(t => t.isGoal);
    let consistencyPct = 100;
    if (goalTasks.length > 0) {
      const aliveStreaks = goalTasks.filter(g => computeStreak(g) > 0).length;
      consistencyPct = (aliveStreaks / goalTasks.length) * 100;
    }

    const score = Math.round(completionPct * 0.7 + consistencyPct * 0.3);

    const el = document.getElementById("focusScoreBox");
    let color = "var(--danger)";
    if (score >= 80) color = "var(--accent)";
    else if (score >= 50) color = "var(--warning)";

    el.innerHTML = `
      <div id="focusScoreNum" style="font-size:2rem;font-weight:600;color:${color};">0</div>
      <div style="font-size:0.8rem;color:var(--text-muted);"><i data-lucide="activity" class="icon"></i> Focus Score</div>
    `;
    lucide.createIcons();
    animateCountUp(document.getElementById("focusScoreNum"), score, 550);
  }

  function avgPctForRange(startDaysAgo, endDaysAgo) {
    const today = new Date(); today.setHours(0,0,0,0);
    let sum = 0, count = 0;
    for (let i = startDaysAgo; i >= endDaysAgo; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const p = dayPct(d);
      if (p !== null) { sum += p; count++; }
    }
    return count ? sum / count : null;
  }

  function renderMomentum() {
    const thisWeek = avgPctForRange(6, 0);
    const lastWeek = avgPctForRange(13, 7);
    const el = document.getElementById("momentumBox");

    if (thisWeek === null || lastWeek === null) {
      el.innerHTML = `<div style="color:var(--text-muted);font-size:0.85rem;">Not enough history yet to show momentum.</div>`;
      return;
    }

    const diff = Math.round(thisWeek - lastWeek);
    let icon = "minus", label = "Steady", color = "var(--text-muted)";
    if (diff > 3) { icon = "trending-up"; label = "You're improving"; color = "var(--accent)"; }
    else if (diff < -3) { icon = "trending-down"; label = "Momentum dropping"; color = "var(--danger)"; }

    el.innerHTML = `
      <div style="font-size:1.4rem;color:${color};"><i data-lucide="${icon}" class="icon icon-lg" style="color:inherit;"></i></div>
      <div style="font-weight:500;color:${color};">${label}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);"><span id="momentumThisWeek">0</span>% this week vs <span id="momentumLastWeek">0</span>% last week</div>
    `;
    lucide.createIcons();
    animateCountUp(document.getElementById("momentumThisWeek"), Math.round(thisWeek), 550);
    animateCountUp(document.getElementById("momentumLastWeek"), Math.round(lastWeek), 550);
  }

  function renderRingChart() {
    const today = new Date();
    const todayTasks = getTasksForDate(today, "All");
    const total = todayTasks.length;
    const done = todayTasks.filter(t => t.occurrenceDone).length;
    const pct = total ? Math.round((done / total) * 100) : 0;

    const byCat = {};
    todayTasks.forEach(t => {
      if (!byCat[t.category]) byCat[t.category] = { done: 0, total: 0 };
      byCat[t.category].total++;
      if (t.occurrenceDone) byCat[t.category].done++;
    });

    const svg = document.getElementById("ringChart");
    svg.innerHTML = "";
    const cx = 100, cy = 100, r = 80;
    const circumference = 2 * Math.PI * r;
    const ns = "http://www.w3.org/2000/svg";

    const bg = document.createElementNS(ns, "circle");
    bg.setAttribute("cx", cx); bg.setAttribute("cy", cy); bg.setAttribute("r", r);
    bg.setAttribute("fill", "none"); bg.setAttribute("stroke", "var(--border)"); bg.setAttribute("stroke-width", "20");
    svg.appendChild(bg);

    let cumulative = 0;
    const catKeys = Object.keys(byCat);
    catKeys.forEach((catName, idx) => {
      const info = byCat[catName];
      const segPct = total ? (info.done / total) * 100 : 0;
      if (segPct <= 0) return;
      const segLen = (segPct / 100) * circumference;
      const circle = document.createElementNS(ns, "circle");
      circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", r);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", categoryColor(catName));
      circle.setAttribute("stroke-width", "20");
      circle.setAttribute("stroke-dasharray", `0 ${circumference}`);
      circle.setAttribute("stroke-dashoffset", -((cumulative / 100) * circumference));
      circle.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
      circle.style.transition = "stroke-dasharray 700ms cubic-bezier(0.16, 1, 0.3, 1)";
      svg.appendChild(circle);
      const finalDasharray = `${segLen} ${circumference - segLen}`;
      const delay = catKeys.length > 1 ? idx * 60 : 0;
      requestAnimationFrame(() => {
        setTimeout(() => circle.setAttribute("stroke-dasharray", finalDasharray), delay);
      });
      cumulative += segPct;
    });

    const text1 = document.createElementNS(ns, "text");
    text1.setAttribute("x", cx); text1.setAttribute("y", cy - 6); text1.setAttribute("text-anchor", "middle");
    text1.setAttribute("font-size", "13"); text1.setAttribute("fill", "var(--text-secondary)");
    text1.textContent = "Locked in";
    svg.appendChild(text1);

    const text2 = document.createElementNS(ns, "text");
    text2.setAttribute("x", cx); text2.setAttribute("y", cy + 22); text2.setAttribute("text-anchor", "middle");
    text2.setAttribute("font-size", "28"); text2.setAttribute("font-weight", "600"); text2.setAttribute("fill", "var(--text-primary)");
    text2.textContent = "0%";
    svg.appendChild(text2);
    animateCountUp(text2, pct, 550, "%");

    const legend = document.getElementById("ringLegend");
    legend.innerHTML = "";
    if (Object.keys(byCat).length === 0) {
      legend.innerHTML = "<div style='color:var(--text-muted)'>No tasks scheduled today.</div>";
    }
    Object.keys(byCat).forEach(catName => {
      const info = byCat[catName];
      const row = document.createElement("div");
      row.className = "ring-legend-row";
      const dot = document.createElement("div");
      dot.className = "ring-legend-dot";
      dot.style.background = categoryColor(catName);
      const label = document.createElement("span");
      label.textContent = `${catName}: ${info.done} / ${info.total} tasks completed`;
      row.appendChild(dot);
      row.appendChild(label);
      legend.appendChild(row);
    });
  }

  function dayPct(d) {
    const dayTasks = getTasksForDate(d, "All");
    if (dayTasks.length === 0) return null;
    const done = dayTasks.filter(t => t.occurrenceDone).length;
    return Math.round((done / dayTasks.length) * 100);
  }

  function renderBarChart(range) {
    const container = document.getElementById("barChart");
    container.innerHTML = "";
    let dataPoints = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);

    if (range === "week") {
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        dataPoints.push({ label: d.toLocaleDateString(undefined, { weekday: "short" }), pct: dayPct(d) });
      }
    } else if (range === "month") {
      const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
      for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(today.getFullYear(), today.getMonth(), i);
        if (d > today) { dataPoints.push({ label: i.toString(), pct: null }); continue; }
        dataPoints.push({ label: i.toString(), pct: dayPct(d) });
      }
    } else if (range === "year") {
      for (let m = 0; m < 12; m++) {
        const monthDate = new Date(today.getFullYear(), m, 1);
        const daysInMonth = new Date(today.getFullYear(), m + 1, 0).getDate();
        let sum = 0, count = 0;
        for (let day = 1; day <= daysInMonth; day++) {
          const d = new Date(today.getFullYear(), m, day);
          if (d > today) continue;
          const p = dayPct(d);
          if (p !== null) { sum += p; count++; }
        }
        dataPoints.push({ label: monthDate.toLocaleDateString(undefined, { month: "short" }), pct: count ? Math.round(sum / count) : null });
      }
    }

    const skipStagger = dataPoints.length > 20;
    dataPoints.forEach((dp, idx) => {
      const col = document.createElement("div");
      col.className = "bar-col";
      const fill = document.createElement("div");
      fill.className = "bar-fill";
      fill.style.height = "0%";
      if (dp.pct === null) fill.style.background = "var(--border)";
      const label = document.createElement("div");
      label.className = "bar-label";
      label.textContent = dp.label;
      col.appendChild(fill);
      col.appendChild(label);
      container.appendChild(col);

      const targetHeight = (dp.pct ?? 0) + "%";
      const delay = skipStagger ? 0 : idx * 20;
      requestAnimationFrame(() => {
        setTimeout(() => { fill.style.height = targetHeight; }, delay);
      });
    });

    const valid = dataPoints.filter(dp => dp.pct !== null);
    const bestWorstEl = document.getElementById("bestWorst");
    bestWorstEl.innerHTML = "";
     if (valid.length > 0) {
      const best = valid.reduce((a, b) => b.pct > a.pct ? b : a);
      const worst = valid.reduce((a, b) => b.pct < a.pct ? b : a);
      bestWorstEl.innerHTML = `<div class="box"><i data-lucide="flame" class="icon"></i> Best: ${best.label} (${best.pct}%)</div><div class="box"><i data-lucide="trending-down" class="icon"></i> Toughest: ${worst.label} (${worst.pct}%)</div>`;
      lucide.createIcons();
    }
  }

  document.querySelectorAll(".range-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".range-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentRange = btn.dataset.range;
      renderBarChart(currentRange);
    });
  });
  const SESSIONS = [
    { name: "Sprint", icon: "zap", time: "25 / 5", work: 25 },
    { name: "Flow", icon: "waves", time: "50 / 10", work: 50 },
    { name: "Ultra", icon: "flame", time: "90 / 20", work: 90 },
    { name: "Custom", icon: "settings", time: "Choose", work: null }
  ];
  let selectedSession = 0;

  function renderFocus() {
    document.getElementById("focusSetup").style.display = "block";
    document.getElementById("focusTimerScreen").style.display = "none";

    const grid = document.getElementById("focusSessionGrid");
    grid.innerHTML = "";
    SESSIONS.forEach((s, i) => {
      const card = document.createElement("button");
      card.className = "focus-session" + (i === selectedSession ? " selected" : "");
      card.innerHTML = `<div class="session-name"><i data-lucide="${s.icon}" class="icon"></i> ${s.name}</div><div class="session-time">${s.time}</div>`;
      card.addEventListener("click", () => { selectedSession = i; renderFocus(); });
      grid.appendChild(card);
    });
    lucide.createIcons();

    document.getElementById("customMinutesRow").style.display = selectedSession === 3 ? "block" : "none";

    const container = document.getElementById("focusTopTasks");
    container.innerHTML = "";
    const todayTasks = getTasksForDate(new Date(), "All").filter(t => !t.occurrenceDone).slice(0, 3);

    if (todayTasks.length === 0) {
      container.innerHTML = '<div class="focus-empty"><i data-lucide="check-circle-2" class="icon icon-accent"></i> Everything is done today</div>';
      lucide.createIcons();
      return;
    }
    todayTasks.forEach(task => {
      const row = document.createElement("div");
      row.className = "focus-task-row";
      row.textContent = task.checkoffLabel || task.name;
      container.appendChild(row);
    });
  }
  let timerInterval = null;
  let remainingSeconds = 0;
  let totalSeconds = 0;
  let timerRunning = false;

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function drawTimerRing(pctRemaining) {
    const svg = document.getElementById("timerRing");
    svg.innerHTML = "";
    const ns = "http://www.w3.org/2000/svg";
    const cx = 100, cy = 100, r = 90;
    const circumference = 2 * Math.PI * r;

    const bg = document.createElementNS(ns, "circle");
    bg.setAttribute("cx", cx); bg.setAttribute("cy", cy); bg.setAttribute("r", r);
    bg.setAttribute("fill", "none"); bg.setAttribute("stroke", "var(--border)"); bg.setAttribute("stroke-width", "10");
    svg.appendChild(bg);

    const fg = document.createElementNS(ns, "circle");
    fg.setAttribute("cx", cx); fg.setAttribute("cy", cy); fg.setAttribute("r", r);
    fg.setAttribute("fill", "none"); fg.setAttribute("stroke", "var(--accent)"); fg.setAttribute("stroke-width", "10");
    fg.setAttribute("stroke-linecap", "round");
    const dashLen = (pctRemaining / 100) * circumference;
    fg.setAttribute("stroke-dasharray", `${dashLen} ${circumference - dashLen}`);
    fg.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
    fg.style.transition = "stroke-dasharray 1s linear";
    svg.appendChild(fg);
  }

  function updateTimerDisplay() {
    document.getElementById("timerTime").textContent = formatTime(remainingSeconds);
    drawTimerRing((remainingSeconds / totalSeconds) * 100);
  }

  function tick() {
    if (!timerRunning) return;
    remainingSeconds--;
    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      updateTimerDisplay();
      showToast("Session complete", "success", 3500);
      endTimer();
      return;
    }
    updateTimerDisplay();
  }

  function startTimer() {
    const session = SESSIONS[selectedSession];
    let workMinutes = session.work;
    if (selectedSession === 3) {
      workMinutes = parseInt(document.getElementById("customMinutesInput").value);
      if (!workMinutes || workMinutes < 1) {
        const err = document.getElementById("customMinutesError");
        err.textContent = "Enter custom minutes first.";
        err.classList.add("show");
        return;
      }
    }
    document.getElementById("customMinutesError").classList.remove("show");
    totalSeconds = workMinutes * 60;
    remainingSeconds = totalSeconds;
    timerRunning = true;

    document.getElementById("focusSetup").style.display = "none";
    document.getElementById("focusTimerScreen").style.display = "block";
    document.getElementById("timerLabel").textContent = session.name + " session";
    setIcon(document.getElementById("pauseResumeBtn"), "pause");
    document.body.classList.add("timer-active");

    updateTimerDisplay();
    clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);
  }

  function endTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    document.body.classList.remove("timer-active");
    document.getElementById("focusTimerScreen").style.display = "none";
    document.getElementById("focusSetup").style.display = "block";
  }

  document.getElementById("customMinutesInput").addEventListener("input", () => {
    document.getElementById("customMinutesError").classList.remove("show");
  });

  document.getElementById("startFocusBtn").addEventListener("click", startTimer);

  document.getElementById("pauseResumeBtn").addEventListener("click", () => {
    timerRunning = !timerRunning;
    const btn = document.getElementById("pauseResumeBtn");
    setIcon(btn, timerRunning ? "pause" : "play");
  });

  document.getElementById("stopSessionBtn").addEventListener("click", () => {
    showConfirm({
      title: "End session",
      message: "End this session early?",
      confirmLabel: "End Session",
      danger: true,
      onConfirm: endTimer
    });
  });
  let reflectionDate = new Date();
  let reflections = JSON.parse(localStorage.getItem("reflections")) || {};
  let lockedDays = JSON.parse(localStorage.getItem("lockedDays")) || [];

  function saveLockedDays() {
    localStorage.setItem("lockedDays", JSON.stringify(lockedDays));
  }

  function isDayLocked(dateStr) {
    return lockedDays.includes(dateStr);
  }

  function saveReflections() {
    localStorage.setItem("reflections", JSON.stringify(reflections));
  }

  function renderReflection() {
    document.getElementById("reflWeekday").textContent = reflectionDate.toLocaleDateString(undefined, { weekday: "long" });
    document.getElementById("reflFulldate").textContent = reflectionDate.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });

    const dateStr = toDateStr(reflectionDate);
    const entry = reflections[dateStr] || { wentWell: "", improve: "" };
    document.getElementById("reflWentWell").value = entry.wentWell;
    document.getElementById("reflImprove").value = entry.improve;
    document.getElementById("reflFormError").classList.remove("show");
  }

  document.getElementById("reflPrevDay").addEventListener("click", () => {
    reflectionDate.setDate(reflectionDate.getDate() - 1);
    renderReflection();
  });
  document.getElementById("reflNextDay").addEventListener("click", () => {
    reflectionDate.setDate(reflectionDate.getDate() + 1);
    renderReflection();
  });
  document.getElementById("reflWentWell").addEventListener("input", () => {
    document.getElementById("reflFormError").classList.remove("show");
  });
  document.getElementById("reflImprove").addEventListener("input", () => {
    document.getElementById("reflFormError").classList.remove("show");
  });

  document.getElementById("reflSaveBtn").addEventListener("click", () => {
    const dateStr = toDateStr(reflectionDate);
    const wentWell = document.getElementById("reflWentWell").value.trim();
    const improve = document.getElementById("reflImprove").value.trim();

    if (dateStr === pendingLockDate) {
      if (!wentWell || !improve) {
        const err = document.getElementById("reflFormError");
        err.textContent = "Fill in both fields to end the day.";
        err.classList.add("show");
        return;
      }
      document.getElementById("reflFormError").classList.remove("show");
      lockedDays.push(dateStr);
      saveLockedDays();
      pendingLockDate = null;
      reflections[dateStr] = { wentWell, improve };
      saveReflections();
      document.getElementById("reflWentWell").value = "";
      document.getElementById("reflImprove").value = "";
      showToast("Day ended. Nice work today.", "success");
      renderAll();
    } else {
      reflections[dateStr] = { wentWell, improve };
      saveReflections();
      document.getElementById("reflWentWell").value = wentWell;
      document.getElementById("reflImprove").value = improve;
      showToast("Saved.", "info");
    }
  });
  let pendingLockDate = null;

  document.getElementById("endDayBtn").addEventListener("click", () => {
    const dateStr = toDateStr(currentDate);
    const dayTasks = getTasksForDate(currentDate, "All");
    const unfinished = dayTasks.filter(t => !t.occurrenceDone).length;

    let confirmMsg = "End this day? Write your reflection to finish — you can't check anything off afterward.";
    if (unfinished > 0) confirmMsg = `You still have ${unfinished} unfinished task${unfinished === 1 ? "" : "s"}. ` + confirmMsg;

    showConfirm({
      title: "End day",
      message: confirmMsg,
      confirmLabel: "End Day",
      danger: false,
      onConfirm: () => {
        pendingLockDate = dateStr;
        switchView("reflection");
        reflectionDate = new Date(currentDate);
        renderReflection();
        document.getElementById("reflWentWell").focus();
      }
    });
  });
renderAll();
lucide.createIcons();
</script>
</body>
</html>
